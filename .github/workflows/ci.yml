name: Monorepo CI

on:
  push:
    branches:
      - master
      - work
  pull_request:
    branches:
      - master
      - work
  workflow_dispatch:

jobs:
  backend:
    name: Backend Test (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coder-practice-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        run: mvn -B test -Dspring.profiles.active=test

  frontend:
    name: Frontend Lint & Build (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coder-practice-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: coder-practice-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
